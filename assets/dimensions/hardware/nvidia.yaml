id: nvidia
kind: hardware
displayName: 通用 NVIDIA CUDA 加速卡
version: 1
# 2026-09-28（长任务 1 / A1）：通用 NVIDIA 维度（非 GB10 的其他 CUDA 卡）。
# 探针集与 hardware/gb10.yaml **刻意同形**（见该文件顶部说明：hardware 维度
# 一次只取一个，没有继承机制，各自必须自足）。
# 与 gb10 的差别仅在语义：本维度不假定统一内存机型，故 host-mem / host-limits
# 仍然采集（独立显存的机型上它们退化为"宿主内存是否吃紧"的证据，不会误判）。
probes:
  - id: nv-device
    section: nv-device
    command: "if command -v nvidia-smi >/dev/null 2>&1; then echo \"DSH-SIGNAL nv.smi.available=true\"; nvidia-smi 2>&1 | head -40; else echo \"DSH-SIGNAL nv.smi.available=false (nvidia-smi 不存在：容器内未挂驱动工具或非 NVIDIA 宿主)\"; fi"
  - id: nv-driver-matrix
    section: nv-driver-matrix
    command: "if command -v nvidia-smi >/dev/null 2>&1; then echo \"DSH-SIGNAL nv.driver.version=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1)\"; echo \"DSH-SIGNAL nv.gpu.name=$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -1)\"; echo \"DSH-SIGNAL nv.compute_cap=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader 2>/dev/null | head -1)\"; echo \"DSH-SIGNAL nv.memory.total=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader 2>/dev/null | head -1)\"; cat /proc/driver/nvidia/version 2>/dev/null | head -3 || echo \"DSH-SIGNAL nv.proc.version=missing\"; else echo \"DSH-SIGNAL nv.driver.matrix=unavailable\"; fi"
  - id: nv-ecc
    section: nv-ecc
    command: "if command -v nvidia-smi >/dev/null 2>&1; then nvidia-smi -q -d ECC 2>&1 | grep -aE \"ECC Mode|Volatile|Aggregate|Uncorrectable|Corrected|N/A\" | head -40; else echo \"DSH-SIGNAL nv.ecc=unavailable\"; fi"
  - id: nv-thermal
    section: nv-thermal
    command: "if command -v nvidia-smi >/dev/null 2>&1; then S=${THERMAL_SAMPLES:-6}; I=${THERMAL_INTERVAL:-10}; echo \"DSH-SIGNAL nv.thermal.samples=$S interval=${I}s\"; for i in $(seq 1 \"$S\"); do nvidia-smi --query-gpu=temperature.gpu,clocks_throttle_reasons.active,power.draw --format=csv,noheader 2>&1; sleep \"$I\"; done; else echo \"DSH-SIGNAL nv.thermal=unavailable\"; fi"
  - id: nv-xid
    section: kernel-log
    command: "dmesg 2>/dev/null | grep -aE \"NVRM|Xid|nvrm\" | tail -n 120 || echo \"DSH-SIGNAL nv.xid=unavailable (dmesg 需 root 或权限受限)\""
  - id: nv-topology
    section: nv-topology
    command: "if command -v nvidia-smi >/dev/null 2>&1; then nvidia-smi topo -m 2>&1 | head -20; nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv 2>&1 | head -20; else echo \"DSH-SIGNAL nv.topology=unavailable\"; fi"
  - id: kernel-log
    section: kernel-log
    command: "dmesg 2>/dev/null | tail -n 300 || echo \"DSH-SIGNAL kernel.log=unavailable (dmesg 需 root 或权限受限)\""
  - id: host-mem
    section: host-mem
    command: "echo \"DSH-SIGNAL mem.total_kb=$(awk '/^MemTotal:/{print $2}' /proc/meminfo 2>/dev/null)\"; echo \"DSH-SIGNAL mem.available_kb=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo 2>/dev/null)\"; echo \"DSH-SIGNAL mem.swap_total_kb=$(awk '/^SwapTotal:/{print $2}' /proc/meminfo 2>/dev/null)\"; free -m 2>/dev/null | head -4; head -5 /proc/meminfo 2>/dev/null"
  - id: host-limits
    section: host-limits
    command: "echo \"DSH-SIGNAL ulimit.nofile=$(ulimit -n 2>/dev/null)\"; echo \"DSH-SIGNAL ulimit.nproc=$(ulimit -u 2>/dev/null)\"; echo \"DSH-SIGNAL cgroup.memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo unknown)\"; echo \"DSH-SIGNAL cgroup.memory.current=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo unknown)\"; df -h 2>/dev/null | head -12"
ruleRefs:
  - root-causes/hardware-nvidia-rules.yaml
  - root-causes/hardware-host-rules.yaml
