id: vllm
kind: framework
displayName: vLLM（服务框架；加速卡差异由 hardware 维度承载）
version: 11
# 2026-09-28（长任务 1 / A1）：原本硬绑 `[ascend-arm]`，导致本机（GB10 / NVIDIA CUDA）
# 无法组出任何合法三维组合 —— 新增的 gb10 / nvidia / cpu 硬件维度会成为**死条目**
# （注册在词表里但 resolveCombo 永远 MISSING_PARAM）。
# vLLM 不是 Ascend 专属框架：本文件里的探针全部是**框架级**的
# （包版本 / 启动参数 / 端点 / 日志 / model-config / tokenizer / 质量与精度探针），
# 且每条都用 `command -v` / `docker ps` 自行降级，不假设加速卡品牌。
# 加速卡专属证据（npu-smi / nvidia-smi / dmesg）由 hardware 维度的探针提供。
# 注意：requirement 方向没变（framework 约束 hardware），只是把可选硬件集补全。
requires:
  hardware: [ascend-arm, gb10, nvidia, cpu]
probes:
  - id: vllm-version
    section: vllm-version
    command: "CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); for c in vllm vllm-ascend vllm_ascend torch torch-npu torch_npu transformers tokenizers numpy; do v=$(pip show \"$c\" 2>/dev/null | awk '/^Version:/{print $2}'); [ -n \"$v\" ] && echo \"DSH-SIGNAL pkg.$c=$v\"; done; python3 -c \"import torch,torch_npu;print('DSH-SIGNAL torch_npu.available=true');print('DSH-SIGNAL npu.device_count='+str(torch.npu.device_count()))\" 2>&1 | head -3; python3 -c \"import vllm;print('DSH-SIGNAL vllm.__version__='+vllm.__version__)\" 2>&1 | head -2; pip list 2>/dev/null | grep -iE \"^(vllm|torch|transformers|tokenizers|numpy|safetensors|accelerate|ray|triton)\" | head -20; if [ -n \"${CID:-}\" ]; then echo \"DSH-SIGNAL vllm.container_for_version=$CID\"; docker exec \"$CID\" pip show vllm vllm-ascend torch torch_npu 2>/dev/null | grep -E \"^(Name|Version):\" | paste - - | head -8; docker exec \"$CID\" python3 -c \"import vllm,torch,torch_npu;print('DSH-SIGNAL in_container.vllm='+vllm.__version__);print('DSH-SIGNAL in_container.torch='+torch.__version__);print('DSH-SIGNAL in_container.torch_npu='+torch_npu.__version__)\" 2>&1 | head -4; fi"
  - id: serving-args
    section: vllm-serving-args
    command: "P=$(pgrep -af \"vll[m]\" 2>/dev/null | grep -E \"api_serve[r]|vllm ser[v]e|entrypoin[t]s\" | awk '{print $1}' | head -1); echo \"DSH-SIGNAL vllm.proc.pid=${P:-none}\"; if [ -n \"${P:-}\" ]; then echo \"--- cmdline(host proc):\"; xargs -0 echo < /proc/$P/cmdline 2>/dev/null | head -c 2000; echo; echo \"--- env(host proc, 过滤):\"; xargs -0 -n1 < /proc/$P/environ 2>/dev/null | grep -Ei \"VLLM|ASCEND|HCCL|PRECISION|QUANT|ROPE|MAX_|TP|DP|EP|CACHE|SPEC|COMPILE|GRAPH|ATTENTION\" | head -60; fi; CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); if [ -n \"${CID:-}\" ]; then echo \"DSH-SIGNAL vllm.container=$CID\"; echo \"--- container env:\"; docker exec \"$CID\" sh -c 'xargs -0 -n1 < /proc/1/environ' 2>/dev/null | grep -Ei \"VLLM|ASCEND|HCCL|PRECISION|QUANT|ROPE|MAX_|TP|DP|EP|CACHE|SPEC|COMPILE|GRAPH|ATTENTION\" | sort | head -60; echo \"--- container cmdline(pid1):\"; docker exec \"$CID\" sh -c 'xargs -0 echo < /proc/1/cmdline' 2>/dev/null | head -c 2500; echo; fi"
  - id: vllm-endpoint
    section: vllm-endpoint
    command: "EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; echo \"DSH-SIGNAL vllm.base=$EP\"; echo \"--- models:\"; timeout 15 curl -s --connect-timeout 3 --max-time 30 \"$EP/v1/models\" 2>&1 | head -c 900; echo; echo \"--- metrics:\"; timeout 15 curl -s --connect-timeout 3 --max-time 30 \"$EP/metrics\" 2>/dev/null | grep -E \"^vllm:(num_requests|gpu_cache_usage|prefix_cache|prompt_tokens|generation_tokens|request_success|time_to_first|e2e_request)\" | head -40"
  - id: vllm-log
    section: vllm-log
    command: "CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); if [ -n \"${CID:-}\" ]; then echo \"DSH-SIGNAL vllm.container=$CID\"; echo \"--- docker logs 尾部 1200 行（若引擎把日志写到文件，这里可能只有启动脚本；engine-log 段负责文件）:\"; docker logs --tail 1200 \"$CID\" 2>&1 | grep -aE \"Initializing|with config|SamplingParams|Received request|Prefix cache hit rate|preempt|WARNING|ERROR|Traceback|abort|unrecognized\" | tail -60; else echo \"DSH-SIGNAL vllm.container=unavailable\"; fi"
  - id: chat-template
    section: chat-template
    command: 'CID=$(docker ps --format "{{.ID}} {{.Image}}" 2>/dev/null | grep -iE "vllm" | head -1 | awk ''{print $1}''); CMDLINE=""; if [ -n "${CID:-}" ]; then VPID=$(docker exec "$CID" sh -c ''ps -eo pid,args 2>/dev/null | grep -E "vll[m] serve|api_serve[r]" | awk "{print \$1}" | head -1'' 2>/dev/null); echo "DSH-SIGNAL chat_template.container_vllm_pid=${VPID:-none} (容器 PID1 常是启动脚本，故按进程名找)"; [ -n "$VPID" ] && CMDLINE=$(docker exec "$CID" sh -c "tr ''\\0'' '' '' < /proc/$VPID/cmdline" 2>/dev/null); fi; if [ -z "$CMDLINE" ]; then P=$(pgrep -af "vll[m]" 2>/dev/null | grep -E "api_serve[r]|vllm ser[v]e|entrypoin[t]s" | awk ''{print $1}'' | head -1); [ -n "${P:-}" ] && CMDLINE=$(xargs -0 echo < /proc/$P/cmdline 2>/dev/null); fi; echo "DSH-SIGNAL serve.cmdline_chars=${#CMDLINE}"; echo "--- 关键启动参数:"; echo "$CMDLINE" | xargs -d '' '' -n1 echo | grep -A1 -E "^--(chat-template|tool-call-parser|reasoning-parser|enable-auto-tool-choice|tokenizer-mode|served-model-name|trust-remote-code|quantization|dtype|max-model-len|max-num-seqs|max-num-batched-tokens|kv-cache-dtype|enable-prefix-caching|enable-expert-parallel|data-parallel-size|tensor-parallel-size|enforce-eager|compilation-config|speculative-config|rope-scaling|rope-theta|block-size|gpu-memory-utilization|enable-chunked-prefill|additional-config|model-loader-extra-config)$" | head -80; TP=$(echo "$CMDLINE" | xargs -d '' '' -n1 echo | grep -A1 -E "^--chat-template$" | tail -1); if [ -n "$TP" ]; then echo "DSH-SIGNAL chat_template.file=$TP"; if [ -n "${CID:-}" ]; then docker exec "$CID" head -n 150 "$TP" 2>/dev/null; else head -n 150 "$TP" 2>/dev/null; fi; fi; for f in $(timeout 30 find "${MODEL_DIR:-/}" -maxdepth 6 -name tokenizer_config.json 2>/dev/null | head -2); do echo "--- 模板字段: $f"; python3 -c "import json,sys;d=json.load(open(sys.argv[1]));t=d.get(''chat_template'');print((t[:2000] if isinstance(t,str) else str(t))[:2000])" "$f" 2>/dev/null; done'
  - id: model-config
    section: model-config
    command: "for f in $(timeout 30 find \"${MODEL_DIR:-/}\" -maxdepth 6 -name config.json 2>/dev/null | head -3); do echo \"--- model-config: $f\"; grep -Eo '\"(model_type|architectures|torch_dtype|max_position_embeddings|rope_theta|rope_scaling|vocab_size|hidden_size|num_hidden_layers|num_attention_heads|num_key_value_heads|tie_word_embeddings|quant_method|quantization_config|load_in_8bit|load_in_4bit|num_local_experts|num_experts_per_tok|sliding_window|attention_bias)\"[^,}]*' \"$f\" | head -30; done"
  - id: model-weights
    section: model-weights
    command: "for d in $(timeout 30 find \"${MODEL_DIR:-/}\" -maxdepth 6 -name \"*.safetensors.index.json\" -o -maxdepth 6 -name \"pytorch_model.bin.index.json\" 2>/dev/null | head -2 | xargs -r -n1 dirname | sort -u); do echo \"--- weights-dir: $d\"; ls -l \"$d\" | head -25; echo \"DSH-SIGNAL weights.shards_declared=$(grep -o '\"[^\"]*\\.safetensors\"' \"$d\"/*.index.json 2>/dev/null | sort -u | wc -l)\"; echo \"DSH-SIGNAL weights.shards_present=$(ls \"$d\"/*.safetensors 2>/dev/null | wc -l)\"; ls \"$d\" | grep -Ei \"scale|quant|zero|amax|kv_scale\" | head -10; done"
  - id: tokenizer-fingerprint
    section: tokenizer-fingerprint
    command: 'for f in $(timeout 30 find "${MODEL_DIR:-/}" -maxdepth 6 \( -name tokenizer.json -o -name tokenizer_config.json -o -name vocab.json -o -name merges.txt -o -name special_tokens_map.json \) 2>/dev/null | head -6); do echo "--- 指纹文件: $f"; sha256sum "$f"; done; timeout 15 find "${MODEL_DIR:-/}" -maxdepth 6 -name tokenizer_config.json 2>/dev/null | head -1 | xargs -r grep -Eo ''"(tokenizer_class|model_max_length|add_bos_token|add_eos_token|clean_up_tokenization_spaces)"[^,}]*'' | head -10; # 往返判别（H2 最便宜的证伪手段）：tokenize 已知混排文本 → detokenize 回读'
  - id: tokenizer-roundtrip
    section: tokenizer-roundtrip
    command: "EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; M=\"${MODEL_NAME:-$(timeout 10 curl -s --connect-timeout 3 --max-time 30 \"$EP/v1/models\" 2>/dev/null | grep -o '\"id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4)}\"; TXT=\"张量并行把一层权重切成若干份。TP=4, dtype=bfloat16, 中文English混排。\"; IDS=$(timeout 25 curl -s --connect-timeout 3 --max-time 30 \"$EP/tokenize\" -H \"Content-Type: application/json\" -d \"{\\\"model\\\":\\\"$M\\\",\\\"prompt\\\":\\\"$TXT\\\"}\" 2>&1 | head -c 900); echo \"--- tokenize($M): $IDS\"; TOK=$(echo \"$IDS\" | grep -o \"\\[[0-9, ]*\\]\" | head -1); RT=$(timeout 25 curl -s --connect-timeout 3 --max-time 30 \"$EP/detokenize\" -H \"Content-Type: application/json\" -d \"{\\\"model\\\":\\\"$M\\\",\\\"tokens\\\":${TOK:-[]}}\" 2>&1 | head -c 600); echo \"--- detokenize: $RT\"; case \"$IDS\" in *\\\"count\\\"*) case \"$RT\" in *张量并行*) echo \"DSH-SIGNAL tokenizer.roundtrip_ok=true\";; *) echo \"DSH-SIGNAL tokenizer.roundtrip_ok=false\";; esac;; *) echo \"DSH-SIGNAL tokenizer.roundtrip=n/a (端点无有效 tokenize 响应，不下结论)\";; esac"
  - id: quality-probe
    section: quality-probe
    command: "EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; M=\"${MODEL_NAME:-}\"; [ -z \"$M\" ] && M=$(timeout 10 curl -s --connect-timeout 3 --max-time 30 \"$EP/v1/models\" | grep -o '\"id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4); echo \"DSH-SIGNAL quality.model=$M\"; CH=\"$EP/v1/chat/completions\"; ask(){ timeout 120 curl -s --connect-timeout 3 --max-time 90 \"$CH\" -H 'Content-Type: application/json' -d \"{\\\"model\\\":\\\"$M\\\",\\\"messages\\\":$1,\\\"temperature\\\":0,\\\"max_tokens\\\":512,\\\"seed\\\":7}\" 2>&1 | head -c 8000; }; strip(){ python3 -c \"import json,sys;d=json.load(sys.stdin);m=d['choices'][0]['message'];print(json.dumps({'c':m.get('content'),'r_len':len(m.get('reasoning') or '')},ensure_ascii=False,sort_keys=True))\" 2>/dev/null; }; A=$(ask '[{\"role\":\"user\",\"content\":\"用一句话说明什么是张量并行。\"}]'); B=$(ask '[{\"role\":\"user\",\"content\":\"用一句话说明什么是张量并行。\"}]'); echo \"--- temp0-run1(core): $(printf '%s' \"$A\" | strip)\"; echo \"--- temp0-run2(core): $(printf '%s' \"$B\" | strip)\"; case \"$A\" in *'\"choices\"'*) echo \"DSH-SIGNAL quality.endpoint=ok\"; SA=$(printf '%s' \"$A\" | strip); SB=$(printf '%s' \"$B\" | strip); if [ -n \"$SA\" ] && [ \"$SA\" = \"$SB\" ]; then echo \"DSH-SIGNAL quality.deterministic=true (仅比较 content/reasoning 长度，排除 id/created 噪声)\"; else echo \"DSH-SIGNAL quality.deterministic=false\"; fi; case \"$A\" in *'\"content\":\"\"'*) echo \"DSH-SIGNAL quality.content_empty=true (content 空：思考型模型 + max_tokens 不足)\";; esac;; *) echo \"DSH-SIGNAL quality.probe=endpoint-unreachable (响应无 choices)\";; esac; echo \"--- agents-style:\"; ask '[{\"role\":\"system\",\"content\":\"You are a coding agent.\"},{\"role\":\"user\",\"content\":\"列出当前目录文件。\"},{\"role\":\"assistant\",\"content\":null,\"tool_calls\":[{\"id\":\"c1\",\"type\":\"function\",\"function\":{\"name\":\"ls\",\"arguments\":\"{\\\"p\\\":\\\".\\\"}\"}}]},{\"role\":\"tool\",\"tool_call_id\":\"c1\",\"content\":\"a.py b.txt\"}]' | head -c 700; LONG=$(for i in $(seq 1 600); do printf \"这是一段用于填充上下文的文本。\"; done); echo \"DSH-SIGNAL longctx.chars=${#LONG}\"; ask \"[{\\\"role\\\":\\\"user\\\",\\\"content\\\":\\\"请只回答一个字：好。忽略以下重复字符。$LONG\\\"}]\" | head -c 400"
  - id: precision-log
    section: precision-log
    command: "CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); if [ -n \"${CID:-}\" ]; then echo \"--- container env(precision/graph 相关):\"; docker exec \"$CID\" sh -c 'xargs -0 -n1 < /proc/1/environ' 2>/dev/null | grep -Ei \"ASCEND|HCCL|PRECISION|COMPILE|GRAPH|ATTENTION|DTYPE|FALLBACK\" | sort | head -40; echo \"--- container log 关键行:\"; docker logs --tail 3000 \"$CID\" 2>&1 | grep -Ei \"fallback|precision|overflow|nan|inf|aclnn|aicore|unsupported|not supported|degrad|unrecognized arguments|ERROR|WARN\" | tail -n 80; fi; P=$(pgrep -af \"vll[m]\" 2>/dev/null | grep -E \"api_serve[r]|vllm ser[v]e|entrypoin[t]s\" | awk '{print $1}' | head -1); for L in $( { ls -1 /var/log/vllm*.log /tmp/*vllm*.log ./nohup.out \"$HOME\"/vllm*.log 2>/dev/null; [ -n \"${P:-}\" ] && readlink -f /proc/$P/fd/1 2>/dev/null; } | sort -u | head -3); do [ -f \"$L\" ] && { echo \"--- precision-log: $L\"; grep -Ei \"fallback|precision|overflow|nan|inf|aclnn|aicore|unsupported|unrecognized arguments\" \"$L\" | tail -n 60; }; done"
  - id: quality-sweep
    section: quality-sweep
    command: "EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; M=\"${MODEL_NAME:-}\"; [ -z \"$M\" ] && M=$(timeout 10 curl -s --connect-timeout 3 --max-time 30 \"$EP/v1/models\" | grep -o '\"id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4); N=${SAMPLE_N:-8}; MT=${SAMPLE_MAX_TOKENS:-512}; snap(){ timeout 20 curl -s --connect-timeout 3 --max-time 15 \"$EP/metrics\" 2>/dev/null | grep -E '^vllm:(spec_decode_num_(accepted|draft)_tokens_total|num_preemptions_total|prefix_cache_hits_total|request_success_total.*finished_reason=\"length\")' | awk '{s+=$NF} END{printf \"%d\", s}'; }; S0=$(snap); echo \"DSH-SIGNAL quality.sweep.n=$N model=$M max_tokens=$MT metrics_snapshot_sum_before=$S0\"; VALID=0; i=1; while [ $i -le $N ]; do R=$(timeout 120 curl -s --connect-timeout 3 --max-time 90 \"$EP/v1/chat/completions\" -H 'Content-Type: application/json' -d \"{\\\"model\\\":\\\"$M\\\",\\\"messages\\\":[{\\\"role\\\":\\\"user\\\",\\\"content\\\":\\\"请用一句中文说明什么是张量并行，只输出这句话。\\\"}],\\\"temperature\\\":0,\\\"max_tokens\\\":$MT,\\\"seed\\\":$i}\" 2>&1 | head -c 8000); CORE=$(printf '%s' \"$R\" | python3 -c \"import json,sys;d=json.load(sys.stdin);m=d['choices'][0]['message'];c=m.get('content') or '';r=m.get('reasoning') or '';print(json.dumps({'c':c[:40],'c_len':len(c),'r_len':len(r),'finish':d['choices'][0].get('finish_reason')},ensure_ascii=False))\" 2>/dev/null); if [ -n \"$CORE\" ]; then H=$(printf '%s' \"$CORE\" | sha256sum | cut -c1-8); echo \"DSH-SIGNAL quality.sample.$i=core_hash:$H $CORE\"; VALID=$((VALID+1)); else echo \"DSH-SIGNAL quality.sample.$i=n/a (响应不可解析：**不下结论**，不用空串哈希冒充样本指纹)\"; fi; i=$((i+1)); done; S1=$(snap); echo \"DSH-SIGNAL quality.sweep.valid=$VALID/$N (有效样本数：n/a 的不是样本，不能计入一致性判定)\"; echo \"DSH-SIGNAL quality.sweep.metrics_snapshot_sum_after=$S1\"; echo \"DSH-SIGNAL quality.sweep.done=true（core_hash 仅覆盖 content/reasoning/finish；snapshot 用于把异常样本与调度/缓存计数关联）\""
  - id: effective-config
    section: effective-config
    command: "CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); if [ -n \"${CID:-}\" ]; then echo \"--- 引擎自报有效配置（容器日志里的 Initializing 行，最能反映真正生效的配置）:\"; docker logs \"$CID\" 2>&1 | grep -m2 -A3 -E \"Initializing a V1 LLM engine|Initializing an LLM engine\" | head -c 6000; echo; echo \"--- 该行里的关键字段:\"; docker logs \"$CID\" 2>&1 | grep -m1 -oE \"(speculative_config|quantization|kv_cache_dtype|max_seq_len|tensor_parallel_size|data_parallel_size|enable_prefix_caching|enable_chunked_prefill|block_size|enforce_eager|dtype)=[^,]*\" | head -20; else echo \"DSH-SIGNAL effective_config=unavailable(未找到容器)\"; fi"
  - id: metrics-full
    section: metrics-full
    command: "EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; M=\"${MODEL_NAME:-}\"; [ -z \"$M\" ] && M=$(timeout 10 curl -s --connect-timeout 3 --max-time 30 \"$EP/v1/models\" | grep -o '\"id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4); echo \"DSH-SIGNAL metrics.model=$M\"; ALL=$(timeout 30 curl -s --connect-timeout 3 --max-time 25 \"$EP/metrics\" 2>/dev/null); if [ -z \"$ALL\" ]; then echo \"DSH-SIGNAL metrics.unavailable=true（/metrics 无响应：该部署可能未暴露指标端点）\"; else echo \"DSH-SIGNAL metrics.family_count=$(printf '%s' \"$ALL\" | grep -c '^vllm:')\"; echo \"--- 指标族清单（不带标签，用于确认哪些证据可采）:\"; printf '%s' \"$ALL\" | grep -E '^vllm:' | sed 's/{.*//' | sort -u | head -70; echo \"--- 草稿/接受率（H-B 直接证据链）:\"; printf '%s' \"$ALL\" | grep -E '^vllm:spec_decode' | head -30; echo \"--- 队列/KV/调度（H-C 直接证据链）:\"; printf '%s' \"$ALL\" | grep -E '^vllm:(num_preemptions_total|num_requests_running|num_requests_waiting|kv_cache_usage_perc|gpu_cache_usage_perc|prefix_cache_(queries|hits)_total|max_num_seqs)' | head -40; echo \"--- 延迟与吞吐:\"; printf '%s' \"$ALL\" | grep -E '^vllm:(time_to_first_token_seconds_(sum|count)|e2e_request_latency_seconds_(sum|count)|request_success_total)' | head -30; echo \"--- 失败/中止类（若有）:\"; printf '%s' \"$ALL\" | grep -Ei '^vllm:.*(fail|error|abort|cancel|reject|drop)' | head -20; fi"
  - id: evidence-gaps
    section: evidence-gaps
    command: "echo \"DSH-SIGNAL evidence.available.0=effective_config（引擎自报生效配置：容器日志 Initializing 行）\"; echo \"DSH-SIGNAL evidence.available.1=metrics（/metrics 指标族，含 spec_decode/抢占/缓存/延迟）\"; echo \"DSH-SIGNAL evidence.available.2=weights_and_tokenizer（分片数与指纹）\"; EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; if timeout 15 curl -s --connect-timeout 3 --max-time 10 \"$EP/metrics\" 2>/dev/null | grep -q '^vllm:'; then echo \"DSH-SIGNAL evidence.available.3=metrics_endpoint=ok\"; else echo \"DSH-SIGNAL evidence.missing.0=metrics_endpoint（/metrics 不可达 → 无法用指标做时间/计数关联）\"; fi; CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); if [ -n \"${CID:-}\" ]; then if docker logs --tail 200 \"$CID\" 2>&1 | grep -qE 'SamplingParams|Received request'; then echo \"DSH-SIGNAL evidence.available.4=request_params（日志含请求级参数）\"; else echo \"DSH-SIGNAL evidence.missing.1=client_request_params（服务未开 --enable-log-requests → 看不到客户端 temperature/惩罚/max_tokens；这是许多假设无法判定的根本原因）\"; fi; else echo \"DSH-SIGNAL evidence.missing.2=container（未定位到容器）\"; fi; echo \"DSH-SIGNAL evidence.missing.3=response_body（vLLM 不落响应正文；若无法取到网关/平台记录或客户端留痕，则'输出内容是否正确'在原理上无法从服务端日志判定——这一点必须显式声明，不能靠推理补全）\"; echo \"DSH-SIGNAL evidence.missing.4=per_request_binding（指标为聚合值，无法把单个坏样本绑定到具体 engine/rank；需要 -—collect-detailed-traces 或网关 request_id 才能建立绑定）\""
  - id: engine-log
    section: engine-log
    command: "CID=$(docker ps --format \"{{.ID}} {{.Image}}\" 2>/dev/null | grep -iE \"vllm\" | head -1 | awk '{print $1}'); if [ -z \"${CID:-}\" ]; then echo \"DSH-SIGNAL engine_log=unavailable(未定位到容器)\"; else LOGS=$(docker exec \"$CID\" sh -c 'ls -1 /workspace/*.log /root/*.log /tmp/*.log /app/*.log 2>/dev/null | head -5' 2>/dev/null); if [ -z \"$LOGS\" ]; then LOGS=$(docker exec \"$CID\" sh -c 'find / -maxdepth 3 -name \"*.log\" 2>/dev/null | head -5' 2>/dev/null); fi; N=0; for L in $LOGS; do N=$((N+1)); done; echo \"DSH-SIGNAL engine_log.files=$N\"; for L in $LOGS; do echo \"--- engine-log: $L\"; echo \"--- [启动期] 生效配置字段:\"; docker exec \"$CID\" sh -c \"head -n 500 '$L'\" 2>/dev/null | grep -aE \"Initializing|with config|speculative_config|quantization=|kv_cache_dtype=|max_seq_len=|enable_prefix_caching|enable_chunked_prefill|tensor_parallel_size=|data_parallel_size=|block_size=|sliding_window|dtype=\" | head -30; echo \"--- [尾部 3000 行] 请求级参数/调度统计/告警:\"; docker exec \"$CID\" sh -c \"tail -n 3000 '$L'\" 2>/dev/null | grep -aE \"SamplingParams|Received request|Added request|Prefix cache hit rate|Avg prompt throughput|Running: |Waiting: |preempt|abort|WARNING|ERROR|Traceback|NaN|Inf|fallback|unsupported|accepted\" | tail -n 150; done; fi"
  - id: logits-probe
    section: logits-probe
    command: "EP=\"${VLLM_BASE:-http://127.0.0.1:8000}\"; M=\"${MODEL_NAME:-}\"; [ -z \"$M\" ] && M=$(timeout 10 curl -s --connect-timeout 3 --max-time 30 \"$EP/v1/models\" | grep -o '\"id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4); echo \"DSH-SIGNAL logits.model=$M\"; TS=$(date +%s); A=\"probeA-$TS\"; B=\"probeB-$TS\"; one(){ timeout 180 curl -s --connect-timeout 3 --max-time 150 \"$EP/v1/chat/completions\" -H 'Content-Type: application/json' -d \"{\\\"model\\\":\\\"$M\\\",\\\"messages\\\":[{\\\"role\\\":\\\"user\\\",\\\"content\\\":\\\"用一句话说明什么是张量并行。\\\"}],\\\"temperature\\\":0,\\\"seed\\\":7,\\\"max_tokens\\\":1,\\\"logprobs\\\":true,\\\"top_logprobs\\\":5$1}\" 2>&1; }; t0=$(date +%s); R1=$(one \",\\\"cache_salt\\\":\\\"$A\\\"\"); t1=$(date +%s); R2=$(one \",\\\"cache_salt\\\":\\\"$A\\\"\"); t2=$(date +%s); R3=$(one \",\\\"cache_salt\\\":\\\"$B\\\"\"); t3=$(date +%s); echo \"DSH-SIGNAL logits.salt_supported=$(printf '%s' \"$R1\" | grep -c cache_salt)\"; rd(){ printf '%s' \"$1\" | python3 -c \"import json,sys;d=json.load(sys.stdin);c=d['choices'][0];lp=c.get('logprobs') or {};cs=(lp.get('content') or [{}])[0];t5=cs.get('top_logprobs') or [];print('tok=%r lp=%s top5=%s ptok=%s' % (cs.get('token'), cs.get('logprob'), ','.join('%s:%s'%(x.get('token'),x.get('logprob')) for x in t5[:5]), (d.get('usage') or {}).get('prompt_tokens')))\" 2>/dev/null || echo '<无法解析：'$(printf '%s' \"$1\" | head -c 160)'>'; }; echo \"--- [路径1 完整重算#1 salt=$A] $(rd \"$R1\") 耗时$((t1-t0))s\"; echo \"--- [路径2 同salt命中]      $(rd \"$R2\") 耗时$((t2-t1))s\"; echo \"--- [路径3 换salt完整重算#2] $(rd \"$R3\") 耗时$((t3-t2))s\"; C1=$(printf '%s' \"$R1\" | python3 -c \"import json,sys;d=json.load(sys.stdin);print((d['choices'][0].get('logprobs') or {}).get('content',[{}])[0].get('logprob'))\" 2>/dev/null); C3=$(printf '%s' \"$R3\" | python3 -c \"import json,sys;d=json.load(sys.stdin);print((d['choices'][0].get('logprobs') or {}).get('content',[{}])[0].get('logprob'))\" 2>/dev/null); if [ -z \"$C1\" ] || [ -z \"$C3\" ]; then echo \"DSH-SIGNAL logits.prefill_repeat_consistent=n/a (端点未返回可解析的 logprobs：**不下结论**，不把失败当成漂移)\"; elif [ \"$C1\" = \"$C3\" ]; then echo \"DSH-SIGNAL logits.prefill_repeat_consistent=true（两次完整重算首 token logprob 相同 → 采样前无漂移）\"; else echo \"DSH-SIGNAL logits.prefill_repeat_consistent=false（两次完整重算首 token logprob 不同 → **采样前已漂移**：这是比文本乱码强得多的判据，直接指向长 prefill 计算/地址路径）\"; fi"
  - id: index-address-probe
    section: index-address-probe
    command: CID=$(docker ps --format "{{.ID}} {{.Image}}" 2>/dev/null | grep -iE "vllm" | head -1 | awk '{print $1}'); if [ -n "${CID:-}" ]; then echo "--- 物理 block/页号相关能力（溢出类根因的可算判据）:"; docker exec "$CID" sh -c 'python3 -c "import vllm,torch;print(1)"' >/dev/null 2>&1 && echo 'DSH-SIGNAL num_blocks.collect=可执行（容器内 python 可用）'; timeout 20 curl -s --connect-timeout 3 --max-time 15 "${VLLM_BASE:-http://127.0.0.1:8000}/metrics" 2>/dev/null | grep -E '^vllm:(num_gpu_blocks|kv_cache|gpu_cache)' | head -5; echo '提示：索引/地址类根因需要现场补充「每块 key-scale 的跨度」与最大物理页号（判据：2^31 除以该跨度取整 +1 是否被触及）'; else echo 'DSH-SIGNAL num_blocks.collect=unavailable'; fi
  - id: perf-snapshot
    section: perf-snapshot
    command: 'EP="${VLLM_BASE:-http://127.0.0.1:8000}"; ME="${MINDIE_ENDPOINT:-}"; [ -n "$ME" ] && EP="${ME%/v1/chat/completions}"; M="${MODEL_NAME:-}"; [ -z "$M" ] && M=$(timeout 10 curl -s --connect-timeout 3 --max-time 8 "$EP/v1/models" 2>/dev/null | grep -o "\"id\":\"[^\"]*\"" | head -1 | cut -d"\"" -f4); if [ -z "$M" ]; then echo "DSH-SIGNAL perf.unavailable=true (端点无 /v1/models 响应：未测到任何性能指标，不臆断)"; else CH="$EP/v1/chat/completions"; P="[{\"role\":\"user\",\"content\":\"用一句话说明什么是张量并行。\"}]"; echo "DSH-SIGNAL perf.model=$M"; echo "DSH-SIGNAL perf.max_tokens=64"; T0=$(date +%s%3N); R=$(timeout 120 curl -s --connect-timeout 3 --max-time 90 "$CH" -H "Content-Type: application/json" -d "{\"model\":\"$M\",\"messages\":$P,\"temperature\":0,\"max_tokens\":64,\"seed\":7}" 2>&1); if [ "$(printf "%s" "$R" | grep -c "choices")" = "0" ]; then echo "DSH-SIGNAL perf.unavailable=true (端点响应无 choices：**未做任何计时/计数**，不臆断)"; else T1=$(date +%s%3N); E2E=$((T1-T0)); echo "DSH-SIGNAL perf.e2e_ms=$E2E"; CT=$(printf "%s" "$R" | python3 -c "import json,sys;d=json.load(sys.stdin);u=d.get(\"usage\") or {};print(u.get(\"completion_tokens\",\"\"))" 2>/dev/null); [ -n "$CT" ] && echo "DSH-SIGNAL perf.completion_tokens=$CT"; FT=""; timeout 90 curl -s -N --connect-timeout 3 --max-time 80 "$CH" -H "Content-Type: application/json" -d "{\"model\":\"$M\",\"messages\":$P,\"temperature\":0,\"max_tokens\":64,\"stream\":true,\"seed\":7}" 2>/dev/null | while IFS= read -r L; do if [ -z "$FT" ]; then case "$L" in *content*) FT=$(date +%s%3N); echo "DSH-SIGNAL perf.ttft_ms=$((FT-T0))";; esac; fi; done; fi; MM=$(timeout 20 curl -s --connect-timeout 3 --max-time 15 "$EP/metrics" 2>/dev/null); if [ -n "$MM" ]; then KV=$(printf "%s" "$MM" | grep -m1 "^vllm:gpu_cache_usage_perc" | grep -o "[0-9.]*$"); [ -n "$KV" ] && echo "DSH-SIGNAL perf.kv_cache_usage=$KV"; PH=$(printf "%s" "$MM" | grep -m1 "^vllm:prefix_cache_hits_total" | grep -o "[0-9.]*$"); PQ=$(printf "%s" "$MM" | grep -m1 "^vllm:prefix_cache_queries_total" | grep -o "[0-9.]*$"); [ -n "$PH" ] && [ -n "$PQ" ] && [ "$PQ" != "0" ] && python3 -c "print(\"DSH-SIGNAL perf.prefix_cache_hit_rate=%.4f\" % ($PH/$PQ))"; NP=$(printf "%s" "$MM" | grep -m1 "^vllm:num_preemptions_total" | grep -o "[0-9.]*$"); [ -n "$NP" ] && echo "DSH-SIGNAL perf.num_preemptions=$NP"; else echo "DSH-SIGNAL perf.metrics=unavailable"; fi; fi; true'
ruleRefs:
  - root-causes/framework-vllm-rules.yaml
  - root-causes/quality-gibberish-rules.yaml
  - root-causes/methodology-rules.yaml
  - root-causes/output-anomaly-rules.yaml
envHints:
  baseUrl: "http://127.0.0.1:8000"
  logHint: "docker logs <container> 或 /proc/<pid>/fd/1 指向的文件"
